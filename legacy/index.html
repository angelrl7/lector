<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Lector de Precios</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1f2933; --muted: #6b7785;
      --primary: #0f766e; --primary-dark: #0b5a54; --danger: #c0392b; --border: #dde3e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }
    header { background: var(--primary); color: #fff; padding: 14px 16px; font-size: 1.2rem; font-weight: 600; }
    main { padding: 16px; max-width: 560px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    button {
      font: inherit; border: none; border-radius: 10px; padding: 12px 16px; cursor: pointer;
      background: var(--primary); color: #fff; font-weight: 600;
    }
    button:active { background: var(--primary-dark); }
    button.secondary { background: #e6ecef; color: var(--text); }
    button.danger { background: var(--danger); }
    button.big { width: 100%; font-size: 1.15rem; padding: 16px; }
    input {
      font: inherit; width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 10px; background: #fff; color: var(--text);
    }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    #reader:empty { display: none; }
    .result { text-align: center; }
    .result .name { font-size: 1.3rem; font-weight: 600; margin: 4px 0; }
    .result .price { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 6px 0; }
    .result .code { color: var(--muted); font-size: .9rem; }
    .result.notfound .price { color: var(--danger); font-size: 1.4rem; }
    .hidden { display: none !important; }
    ul.list { list-style: none; padding: 0; margin: 0; }
    ul.list li {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    ul.list li:last-child { border-bottom: none; }
    ul.list .p-name { font-weight: 600; }
    ul.list .p-code { font-size: .8rem; color: var(--muted); }
    ul.list .p-price { font-weight: 700; color: var(--primary); white-space: nowrap; }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff;
      border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
    }
    nav button { flex: 1; background: none; color: var(--muted); border-radius: 0; padding: 16px 0; }
    nav button.active { color: var(--primary); }
    .muted { color: var(--muted); font-size: .9rem; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: .9rem;
      opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>Lector de Precios</header>

  <main>
    <!-- ===== Pestaña Escanear ===== -->
    <section id="tab-scan">
      <div class="card">
        <div id="reader"></div>
        <button id="btn-scan" class="big">📷 Escanear código</button>
        <button id="btn-stop" class="big secondary hidden">Detener cámara</button>
      </div>

      <div id="result" class="card result hidden">
        <div class="name" id="r-name"></div>
        <div class="price" id="r-price"></div>
        <div class="code" id="r-code"></div>
        <div class="row" style="margin-top:14px">
          <button id="btn-edit-found" class="secondary">Editar</button>
          <button id="btn-scan-again">Escanear otro</button>
        </div>
      </div>

      <div class="card">
        <label for="manual-code">O ingresá el código a mano</label>
        <div class="row">
          <input id="manual-code" inputmode="numeric" placeholder="Ej: 7790001234567">
          <button id="btn-manual" style="flex:0 0 auto">Buscar</button>
        </div>
      </div>
    </section>

    <!-- ===== Pestaña Productos ===== -->
    <section id="tab-products" class="hidden">
      <div class="card">
        <div class="row">
          <button id="btn-new">+ Nuevo producto</button>
        </div>
        <label for="search">Buscar</label>
        <input id="search" placeholder="Nombre o código">
      </div>
      <div class="card">
        <ul class="list" id="product-list"></ul>
        <p class="muted" id="empty-msg">No hay productos cargados.</p>
      </div>
      <div class="card">
        <p class="muted" style="margin-top:0">Importá una lista CSV con columnas: <b>codigo,nombre,precio</b></p>
        <div class="row">
          <button class="secondary" id="btn-import">Importar CSV</button>
          <button class="secondary" id="btn-export">Exportar CSV</button>
        </div>
        <input type="file" id="file-input" accept=".csv,text/csv" class="hidden">
      </div>
    </section>

    <!-- ===== Formulario de producto ===== -->
    <section id="tab-form" class="hidden">
      <div class="card">
        <h3 id="form-title" style="margin-top:0">Nuevo producto</h3>
        <label for="f-code">Código</label>
        <div class="row">
          <input id="f-code" inputmode="numeric">
          <button id="btn-scan-form" class="secondary" style="flex:0 0 auto">📷</button>
        </div>
        <div id="reader-form" style="margin-top:10px"></div>
        <label for="f-name">Nombre</label>
        <input id="f-name">
        <label for="f-price">Precio</label>
        <input id="f-price" type="number" inputmode="decimal" step="0.01" min="0">
        <div class="row" style="margin-top:16px">
          <button id="btn-cancel" class="secondary">Cancelar</button>
          <button id="btn-save">Guardar</button>
        </div>
        <button id="btn-delete" class="danger big hidden" style="margin-top:10px">Eliminar</button>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="scan" class="active">📷 Escanear</button>
    <button data-tab="products">📦 Productos</button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    // ---------- Datos ----------
    const STORAGE_KEY = 'lector-productos';

    function loadProducts() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }
    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }
    let products = loadProducts(); // { codigo: { name, price } }

    const money = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
    const $ = (id) => document.getElementById(id);

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = 1200;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch {}
      if (navigator.vibrate) navigator.vibrate(100);
    }

    // ---------- Navegación ----------
    function showTab(name) {
      stopScanner();
      for (const s of ['scan', 'products', 'form']) $('tab-' + s).classList.toggle('hidden', s !== name);
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      if (name === 'products') renderList();
    }
    document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

    // ---------- Escáner ----------
    const FORMATS = [
      'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'CODE_128', 'CODE_39', 'ITF', 'QR_CODE'
    ].map(f => Html5QrcodeSupportedFormats[f]);

    let scanner = null;

    async function startScanner(elementId, onCode) {
      await stopScanner();
      scanner = new Html5Qrcode(elementId, { formatsToSupport: FORMATS, verbose: false });
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45) }) },
          (text) => { beep(); stopScanner(); onCode(text.trim()); },
          () => {}
        );
        return true;
      } catch (err) {
        scanner = null;
        alert('No se pudo abrir la cámara.\n\nRevisá que el navegador tenga permiso y que la página esté abierta con https://.\n\n' + err);
        return false;
      }
    }

    async function stopScanner() {
      if (scanner) {
        const s = scanner;
        scanner = null;
        try { if (s.isScanning) await s.stop(); s.clear(); } catch {}
      }
      $('btn-scan').classList.remove('hidden');
      $('btn-stop').classList.add('hidden');
    }

    $('btn-scan').onclick = async () => {
      $('result').classList.add('hidden');
      if (await startScanner('reader', showResult)) {
        $('btn-scan').classList.add('hidden');
        $('btn-stop').classList.remove('hidden');
      }
    };
    $('btn-stop').onclick = stopScanner;
    $('btn-scan-again').onclick = () => $('btn-scan').click();

    // ---------- Resultado ----------
    let lastCode = null;

    function showResult(code) {
      lastCode = code;
      const p = products[code];
      const box = $('result');
      box.classList.remove('hidden');
      box.classList.toggle('notfound', !p);
      $('r-code').textContent = 'Código: ' + code;
      if (p) {
        $('r-name').textContent = p.name;
        $('r-price').textContent = money.format(p.price);
        $('btn-edit-found').textContent = 'Editar';
      } else {
        $('r-name').textContent = '';
        $('r-price').textContent = 'Producto no encontrado';
        $('btn-edit-found').textContent = 'Agregar';
      }
      box.scrollIntoView({ behavior: 'smooth' });
    }

    $('btn-edit-found').onclick = () => openForm(lastCode);

    $('btn-manual').onclick = () => {
      const code = $('manual-code').value.trim();
      if (code) showResult(code);
    };
    $('manual-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-manual').click(); });

    // ---------- Lista ----------
    function renderList() {
      const q = $('search').value.trim().toLowerCase();
      const entries = Object.entries(products)
        .filter(([code, p]) => !q || code.includes(q) || p.name.toLowerCase().includes(q))
        .sort((a, b) => a[1].name.localeCompare(b[1].name));
      const ul = $('product-list');
      ul.innerHTML = '';
      for (const [code, p] of entries) {
        const li = document.createElement('li');
        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'p-name'; name.textContent = p.name;
        const c = document.createElement('div');
        c.className = 'p-code'; c.textContent = code;
        info.append(name, c);
        const price = document.createElement('div');
        price.className = 'p-price'; price.textContent = money.format(p.price);
        li.append(info, price);
        li.onclick = () => openForm(code);
        ul.appendChild(li);
      }
      $('empty-msg').classList.toggle('hidden', entries.length > 0);
    }
    $('search').oninput = renderList;
    $('btn-new').onclick = () => openForm(null);

    // ---------- Formulario ----------
    let editingCode = null;
    let returnTab = 'products';

    function openForm(code) {
      returnTab = $('tab-scan').classList.contains('hidden') ? 'products' : 'scan';
      showTab('form');
      const p = code ? products[code] : null;
      editingCode = p ? code : null;
      $('form-title').textContent = p ? 'Editar producto' : 'Nuevo producto';
      $('f-code').value = code || '';
      $('f-name').value = p ? p.name : '';
      $('f-price').value = p ? p.price : '';
      $('btn-delete').classList.toggle('hidden', !p);
      (code ? $('f-name') : $('f-code')).focus();
    }

    $('btn-scan-form').onclick = () => startScanner('reader-form', code => {
      $('f-code').value = code;
      $('f-name').focus();
    });

    $('btn-cancel').onclick = () => showTab(returnTab);

    $('btn-save').onclick = () => {
      const code = $('f-code').value.trim();
      const name = $('f-name').value.trim();
      const price = parseFloat($('f-price').value);
      if (!code || !name || isNaN(price)) { toast('Completá código, nombre y precio'); return; }
      if (editingCode && editingCode !== code) delete products[editingCode];
      products[code] = { name, price };
      saveProducts();
      toast('Guardado');
      showTab(returnTab);
      if (returnTab === 'scan') showResult(code);
    };

    $('btn-delete').onclick = () => {
      if (!editingCode || !confirm('¿Eliminar este producto?')) return;
      delete products[editingCode];
      saveProducts();
      toast('Eliminado');
      showTab('products');
    };

    // ---------- CSV ----------
    function parseCSVLine(line, sep) {
      const out = []; let cur = ''; let quoted = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (quoted) {
          if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (ch === '"') quoted = false;
          else cur += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === sep) { out.push(cur); cur = ''; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(s => s.trim());
    }

    function parsePrice(s) {
      s = s.replace(/[^\d.,-]/g, '');
      // "1.234,56" -> 1234.56 ; "1234.56" -> 1234.56 ; "1234,56" -> 1234.56
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      return parseFloat(s);
    }

    $('btn-import').onclick = () => $('file-input').click();
    $('file-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const sep = (lines[0] || '').includes(';') ? ';' : ',';
      let count = 0;
      for (const line of lines) {
        const [code, name, priceStr] = parseCSVLine(line, sep);
        const price = parsePrice(priceStr || '');
        if (!code || !name || isNaN(price)) continue; // salta encabezado y líneas inválidas
        products[code] = { name, price };
        count++;
      }
      saveProducts();
      renderList();
      toast(`${count} productos importados`);
      e.target.value = '';
    };

    $('btn-export').onclick = () => {
      const esc = s => /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      const rows = ['codigo,nombre,precio',
        ...Object.entries(products).map(([c, p]) => [esc(c), esc(p.name), p.price].join(','))];
      const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'productos.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    };
  </script>
</body>
</html>
